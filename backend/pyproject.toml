[project]
name = "atc-dsa-backend"
version = "0.1.0"
description = "ATC DSA Roadmap & Resource Hub Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
local = [
    "uvicorn[standard]>=0.30.0",
    "alembic>=1.13.0",
]
dev = [
    "pytest>=8.0.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
    "uvicorn[standard]>=0.30.0",
    "alembic>=1.13.0",
]
legacy = [
    "bcrypt>=4.0.0",
]

[dependency-groups]
workers = [
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
