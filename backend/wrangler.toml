# ATC DSA Hub - independent Cloudflare Worker deployment.
# This configuration intentionally contains placeholders for account-specific resources.
# Complete docs/CLOUDFLARE_DEPLOYMENT.md before deploying.
name = "atc-dsa-final-api"
main = "src/worker.py"
compatibility_date = "2026-09-08"
compatibility_flags = ["python_workers"]

[python_modules]
exclude = ["**/*.pyc", "**/__pycache__/**", "**/*.c", "**/*.h", "**/*.pyi"]

# Create a NEW Hyperdrive configuration in your Cloudflare account and paste its ID here.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "159d7ddd2b8648688a57b6fadbbd1ad6"

# These namespaces are bindings for this Worker only. Keep IDs unique in your account.
[[ratelimits]]
name = "RL_AUTH_EXCHANGE"
namespace_id = "7391826401"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AUTH_REFRESH"
namespace_id = "7391826402"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_ANALYTICS"
namespace_id = "7391826403"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_WEBHOOKS"
namespace_id = "7391826404"
simple = { limit = 100, period = 60 }

[triggers]
crons = ["0 0 * * *", "0 1-23 * * *"]

[vars]
ENVIRONMENT = "production"
AUTH_MODE = "clerk"
PROJECT_NAME = "ATC DSA Roadmap & Resource Hub"
API_V1_STR = "/api/v1"
STUDENT_ALLOWED_EMAIL_DOMAIN = "bennett.edu.in"
EMAILS_FROM_EMAIL = "REPLACE_WITH_VERIFIED_SENDER_EMAIL"
EMAILS_FROM_NAME = "ATC DSA Roadmap Hub"
CLOUDFLARE_ORIGIN_URL = "https://atc-dsa-final-api.REPLACE_WITH_WORKERS_SUBDOMAIN.workers.dev"
ALLOWED_ORIGINS = "http://localhost:5173,https://atc-dsa-final-frontend.pages.dev"
CLERK_JWKS_URL = "https://REPLACE_WITH_CLERK_ISSUER/.well-known/jwks.json"
CLERK_ISSUER = "https://REPLACE_WITH_CLERK_ISSUER"
CLERK_ALLOWED_ORIGINS = "http://localhost:5173,https://atc-dsa-final-frontend.pages.dev"
