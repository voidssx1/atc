# ==============================================================================
# Cloudflare Python Workers Configuration - ATC DSA Hub Backend
# ==============================================================================
# DEPLOYMENT PREREQUISITES:
#   1. Replace every REPLACE_WITH_* value below with your real Cloudflare & Clerk values.
#   2. Never invent or commit production domains, Hyperdrive IDs, or secrets here.
#   3. Set sensitive secrets via Cloudflare Worker Secrets:
#        npx wrangler secret put SECRET_KEY
#        npx wrangler secret put RESEND_API_KEY
#        npx wrangler secret put BREVO_API_KEY
#        npx wrangler secret put CLERK_SECRET_KEY
#        npx wrangler secret put CLERK_WEBHOOK_SECRET
name = "atc-dsa-backend"
main = "worker.py"
compatibility_date = "2026-09-08"
compatibility_flags = ["python_workers"]

# Cloudflare Hyperdrive binding for low-latency connection pooling to Neon PostgreSQL
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "34e6e006848f46c4b75e382dbfafd02a"

# Cloudflare Workers native Rate Limiting bindings (Free-plan compatible, works on workers.dev)
[[ratelimits]]
name = "RL_AUTH_EXCHANGE"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AUTH_REFRESH"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_ANALYTICS"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_WEBHOOKS"
namespace_id = "1004"
simple = { limit = 100, period = 60 }

# Cloudflare Cron Triggers:
#   - 0 1-23 * * * : Hourly session cleanup + Clerk deletion outbox retries
#   - 0 0 * * *    : Daily UTC midnight session cleanup + outbox + URL availability scan
[triggers]
crons = ["0 0 * * *", "0 1-23 * * *"]

# Non-secret environment variables (validated at startup in production Clerk mode)
[vars]
ENVIRONMENT = "production"
AUTH_MODE = "clerk"
PROJECT_NAME = "ATC DSA Roadmap & Resource Hub"
API_V1_STR = "/api/v1"
STUDENT_ALLOWED_EMAIL_DOMAIN = "bennett.edu.in"
EMAILS_FROM_EMAIL = "noreply@bennett.edu.in"
EMAILS_FROM_NAME = "ATC DSA Roadmap Hub"
CLOUDFLARE_ORIGIN_URL = "https://atc-dsa-backend.webatc77.workers.dev"
ALLOWED_ORIGINS = "http://localhost:5173"
CLERK_JWKS_URL = "https://great-bug-2878.clerk.accounts.dev/.well-known/jwks.json"
CLERK_ISSUER = "https://great-bug-2878.clerk.accounts.dev"
CLERK_ALLOWED_ORIGINS = "http://localhost:5173"
