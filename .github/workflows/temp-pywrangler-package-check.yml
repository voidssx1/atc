name: ATC Worker packaging verification

on:
  workflow_dispatch:
  push:
    branches:
      - final
    paths:
      - "backend/pyproject.toml"
      - "backend/wrangler.toml"
      - "backend/src/**"
      - ".github/workflows/temp-pywrangler-package-check.yml"

permissions:
  contents: read

jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch only
        uses: actions/checkout@v4
        with:
          ref: final

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Sync Worker dependencies
        working-directory: backend
        run: uvx --from workers-py pywrangler sync

      - name: Dry-run Worker bundle
        working-directory: backend
        run: npx --yes wrangler deploy --dry-run

      - name: Upload packaging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-final-worker-package
          retention-days: 7
          if-no-files-found: warn
          path: |
            backend/python_modules
            backend/pylock.toml
            backend/uv.lock
